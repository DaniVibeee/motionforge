appId: com.namelessediting.app
productName: Nameless Editing
asar: true
files:
  - main.js
  - preload.js
  - src/**/*
  - package.json
extraResources:
  - from: bin/ffmpeg.exe
    to: bin/ffmpeg.exe
win:
  icon: build/icon.ico
  target:
    - portable
  artifactName: NamelessEditing-${version}-portable.${ext}
directories:
  output: release
